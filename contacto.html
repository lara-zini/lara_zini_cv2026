        <section id="contacto">
            <h1>¿Dudas? Consultas? Propuestas?</h1>
            <h3>Contame sobre vos:</h3>
            <p>*campos obligatorios</p>
            <form method="post" action="" target="_blank" enctype="text/plain">
                <div class="datos">
                    <label for="nombre">
                        <h4>nombre completo*</h4>
                    </label>
                    <input type="text" name="nombre" id="nombre" maxlength="40" placeholder="Sofia Martinez" required>
                    <label for="mail">
                        <h4>mail*</h4>
                    </label>
                    <input type="email" name="mail" id="mail" maxlength="40" placeholder="sofiamartinez@gmail.com"
                        required>
                    <label for="telefono">
                        <h4>telefono*</h4>
                    </label>
                    <input type="tel" name="telefono" id="telefono" maxlength="40" placeholder="(011)22334455" required>
                </div>

                <div class="mensaje">
                    <label for="mensaje">
                        <h4>mensaje*</h4>
                    </label>
                    <textarea name="mensaje" id="mensaje" maxlength="300" required></textarea>
                    <div class="boton-enviar">
                        <input type="submit" value="enviar" class="enviar">
                    </div>
                </div>
            </form>
        </section>
    </main>
